<!DOCTYPE html>
<html>
<head>
    <title>Rotten Tomatoes Review Sentiment Classifier & Search</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 10px; }
        h2 { text-align: center; margin-bottom: 15px; }
        form { margin-bottom: 20px; text-align: center; }
        .input-btn { 
            width: 100%; 
            padding: 12px; 
            font-size: 16px; 
            border-radius: 5px; 
            border: 1px solid #ccc; 
            margin-top: 10px; 
            box-sizing: border-box;
        }
        button { 
            width: 100%; 
            padding: 12px; 
            font-size: 16px; 
            border-radius: 5px; 
            border: none; 
            margin-top: 10px; 
            background: #007bff; 
            color: white; 
            cursor: pointer;
        }
        button:hover { background: #0056b3; }
        .result { margin-top: 20px; font-size: 16px; text-align: left; background: #f9f9f9; padding: 15px; border-radius: 8px; border: 1px solid #ddd; }
        .section { margin-bottom: 40px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sentiment Classifier -->
        <div class="section">
            <h2>Rotten Tomatoes Review Sentiment Classifier</h2>
            <form method="POST" action="/predict">
                <input class="input-btn" type="text" name="text" placeholder="Enter a movie review..." required>
                <button type="submit">Predict Sentiment</button>
            </form>

            {% if prediction %}
            <div class="result">
                <p><b>Input:</b> {{ text }}</p>
                <p><b>Prediction:</b> {{ prediction }}</p>
            </div>
            {% endif %}
        </div>

        <!-- Semantic Search -->
        <div class="section">
            <h2>Semantic Search</h2>
            {% if results %}
            <div class="result">
                <p><b>Top Results:</b></p>
                <ul>
                    {% for r in results %}
                        <li>{{ r }}</li>
                    {% endfor %}
                </ul>
            </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
